name: Deploy Trek Explorer to Pages

on:
  # Merging repository code must not implicitly publish a public site.
  # Only an explicit dispatch against the accepted main branch may deploy.
  workflow_dispatch:

concurrency:
  group: trek-explorer-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
    steps:
      - name: Check out accepted source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check whether the Explorer has landed on main
        id: readiness
        shell: bash
        run: |
          if test -f explorer/index.html && test -f explorer/index.json && \
             test -f explorer/app.js && test -f explorer/app.css; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Explorer assets not yet on main; skipping Pages publication.'
          fi

      - name: Verify Explorer behavior before deployment
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          node tests/test_explorer.mjs

      - name: Verify deterministic catalog index
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          python3 tools/build_explorer_index.py --out "${RUNNER_TEMP}/trek-index-expected.json"
          cmp "${RUNNER_TEMP}/trek-index-expected.json" explorer/index.json

      - name: Verify optional Research Leads index
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          # A tracked or working-tree fifth file activates the fail-closed
          # derivation check. Four-file deployments need no lead generator.
          if git cat-file -e HEAD:explorer/research-leads.json 2>/dev/null || \
             test -e explorer/research-leads.json || test -L explorer/research-leads.json; then
            test -f explorer/research-leads.json
            test ! -L explorer/research-leads.json
            test ! -L tools
            test -f tools/build_research_leads.py
            test ! -L tools/build_research_leads.py
            python3 tools/build_research_leads.py --check
          fi

      - name: Verify final public artifact boundary
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          # Run this AFTER all repository-controlled tests and generators.
          # Publish exactly four committed files, plus a verified optional fifth.
          test -d explorer
          test -f explorer/index.html
          test -f explorer/index.json
          test -f explorer/app.js
          test -f explorer/app.css
          test ! -L explorer
          if find explorer -type l -print -quit | grep -q .; then
            echo "Refusing to deploy a site containing symlinks" >&2
            exit 1
          fi
          # Include directories and special entries, not just regular files:
          # no surprise files, FIFOs, nested folders or hidden content.
          if find explorer -mindepth 1 \
            ! -path explorer/index.html \
            ! -path explorer/index.json \
            ! -path explorer/app.js \
            ! -path explorer/app.css \
            ! -path explorer/research-leads.json -print -quit | grep -q .; then
            echo "Refusing to publish an unexpected Explorer entry" >&2
            exit 1
          fi
          for path in explorer/index.html explorer/index.json explorer/app.js explorer/app.css; do
            expected="$(git rev-parse "HEAD:$path")"
            actual="$(git hash-object "$path")"
            if test "$actual" != "$expected"; then
              echo "Refusing to deploy modified Explorer content: $path" >&2
              exit 1
            fi
          done
          if git cat-file -e HEAD:explorer/research-leads.json 2>/dev/null; then
            test -f explorer/research-leads.json
            test ! -L explorer/research-leads.json
            expected="$(git rev-parse HEAD:explorer/research-leads.json)"
            actual="$(git hash-object explorer/research-leads.json)"
            if test "$actual" != "$expected"; then
              echo "Refusing to deploy modified Research Leads content" >&2
              exit 1
            fi
          elif test -e explorer/research-leads.json || test -L explorer/research-leads.json; then
            echo "Refusing to deploy an uncommitted Research Leads index" >&2
            exit 1
          fi

      - name: Upload Explorer only
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: explorer


  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified Explorer artifact
        id: deployment
        uses: actions/deploy-pages@v5
