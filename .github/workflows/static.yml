name: Deploy Trek Explorer to Pages

on:
  # Merging repository code must not implicitly publish a public site.
  # Only an explicit dispatch against the accepted main branch may deploy.
  workflow_dispatch:

concurrency:
  group: trek-explorer-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
    steps:
      - name: Check out accepted source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check whether the Explorer has landed on main
        id: readiness
        shell: bash
        run: |
          if test -f explorer/index.html && test -f explorer/index.json && \
             test -f explorer/app.js && test -f explorer/app.css && \
             test -f explorer/trek-data-core-hero.jpg; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Explorer assets not yet on main; skipping Pages publication.'
          fi

      - name: Verify Explorer behavior before deployment
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          node tests/test_explorer.mjs
          node tests/test_explorer_accessibility.mjs
          # Original generic art is generated from the accepted safe renderer,
          # not from an externally sourced or rights-uncertain image.
          test -f tools/build_explorer_abstract_art.py
          test ! -L tools/build_explorer_abstract_art.py
          test -f proposals/librarian/original-nasa-fallback-20261103/tools/render_original_abstract_art.py
          test ! -L proposals/librarian/original-nasa-fallback-20261103/tools/render_original_abstract_art.py
          python3 tools/build_explorer_abstract_art.py --check

      - name: Verify deterministic catalog index
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          python3 tools/build_explorer_index.py --out "${RUNNER_TEMP}/trek-index-expected.json"
          cmp "${RUNNER_TEMP}/trek-index-expected.json" explorer/index.json

      - name: Verify optional Research Leads index
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          # The optional research-leads file activates the fail-closed
          # derivation check. Core-only deployments need no lead generator.
          if git cat-file -e HEAD:explorer/research-leads.json 2>/dev/null || \
             test -e explorer/research-leads.json || test -L explorer/research-leads.json; then
            test -f explorer/research-leads.json
            test ! -L explorer/research-leads.json
            test ! -L tools
            test -f tools/build_research_leads.py
            test ! -L tools/build_research_leads.py
            python3 tools/build_research_leads.py --check
          fi

      - name: Verify optional Film discovery index
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          if git cat-file -e HEAD:explorer/film-catalog.json 2>/dev/null || \
             test -e explorer/film-catalog.json || test -L explorer/film-catalog.json; then
            test -f explorer/film-catalog.json
            test ! -L explorer/film-catalog.json
            test ! -L tools
            test -f tools/build_film_catalog.py
            test ! -L tools/build_film_catalog.py
            python3 tools/build_film_catalog.py --check
          fi

      - name: Verify optional Multimedia discovery directory
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          if git cat-file -e HEAD:explorer/discovery-catalog.json 2>/dev/null || \
             test -e explorer/discovery-catalog.json || test -L explorer/discovery-catalog.json; then
            test -f explorer/discovery-catalog.json
            test ! -L explorer/discovery-catalog.json
            test ! -L tools
            test -f tools/build_unified_discovery.py
            test ! -L tools/build_unified_discovery.py
            python3 tools/build_unified_discovery.py --check
          fi

      - name: Verify callable source-local search projection
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          # Search JSON is derived exclusively from four pinned public sidecars.
          test -f explorer/search-catalog.json
          test ! -L explorer/search-catalog.json
          test ! -L tools/build_source_local_search.py
          test ! -L tools/query_trek_index.py
          python3 tools/build_source_local_search.py --check
          python3 tools/query_trek_index.py --validate-sources --limit 1 > /dev/null

      - name: Verify separate publisher-edition lead search overlay
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          # This is not part of the 1,214-row directory or its 37 reviewed synopses.
          test -f explorer/lit-publisher-edition-leads.json
          test ! -L explorer/lit-publisher-edition-leads.json
          test ! -L tools/build_lit_publisher_leads.py
          test ! -L tools/query_lit_publisher_leads.py
          python3 tools/build_lit_publisher_leads.py --check
          python3 tools/query_lit_publisher_leads.py --validate-sources --limit 1 > /dev/null

      - name: Verify separate public publisher ISBN crosscheck overlay
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          # Only accepted first-party public metadata; never owner-private ebook authentication.
          test -f explorer/publisher-isbn-crosschecks.json
          test ! -L explorer/publisher-isbn-crosschecks.json
          test ! -L tools/build_publisher_isbn_crosschecks.py
          test ! -L tools/query_publisher_isbn_crosschecks.py
          # The original code-owned per-row review pins and source/OPF custody
          # checks are mandatory; a 39/30/9 checksum alone is insufficient.
          python3 proposals/librarian/opf-publisher-crosscheck-20261103/validate.py
          python3 proposals/librarian/opf-publisher-crosscheck-next-ten-20261103/validate.py
          python3 proposals/librarian/opf-publisher-crosscheck-third-ten-20261103/validate.py
          python3 proposals/librarian/tng-opf-0076-0079-publisher-crosswalk-20261103/validate.py
          python3 proposals/librarian/opf-publisher-crosscheck-fourth-six-20261103/validate.py
          python3 tools/build_publisher_isbn_crosschecks.py --check
          python3 tools/query_publisher_isbn_crosschecks.py --validate-sources --limit 1 > /dev/null

      - name: Verify source-local Paramount film-page metadata shelf
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          # Factual page metadata only; all three original source and rights
          # validators must pass before any public projection is released.
          test -f explorer/paramount-film-rechecks.json
          test ! -L explorer/paramount-film-rechecks.json
          test ! -L tools/build_paramount_film_rechecks.py
          test ! -L tools/query_paramount_film_rechecks.py
          python3 proposals/films/paramount-six-source-pages-20261103/validate.py
          python3 proposals/films/paramount-second-six-pages-20261103/validate.py
          python3 proposals/films/beyond-paramount-metadata-20261103/validate.py
          python3 tools/build_paramount_film_rechecks.py --check
          python3 tools/query_paramount_film_rechecks.py --limit 1 > /dev/null

      - name: Verify first-party HELD episode-guide cards
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          # All four accepted source validators, strict duplicate-key parsing,
          # whole input digests and code-owned card-level evidence pins run in
          # the deterministic compiler. A cardinality-only check is insufficient.
          test -f explorer/episode-source-cards.json
          test ! -L explorer/episode-source-cards.json
          test ! -L tools/build_episode_source_cards.py
          test ! -L tools/query_episode_source_cards.py
          python3 proposals/research/pic/picard-s1-first5-guide-cards-20261103/validate.py
          python3 proposals/research/pic/picard-s1-last5-guide-cards-20261103/validate.py
          python3 proposals/research/snw/s3-publisher-first5-20261103/validate.py
          python3 proposals/research/snw/s3-publisher-last5-20261103/validate.py
          python3 tools/build_episode_source_cards.py --check
          python3 tools/query_episode_source_cards.py --validate-sources --limit 1 > /dev/null

      - name: Verify optional publisher-description synopsis release
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          # Separate explicit editorial/source observation receipts are
          # required before exposing any publisher-derived plot overview.
          if git cat-file -e HEAD:explorer/synopsis-catalog.json 2>/dev/null || \
             test -e explorer/synopsis-catalog.json || test -L explorer/synopsis-catalog.json; then
            test -f explorer/synopsis-catalog.json
            test ! -L explorer/synopsis-catalog.json
            test -f tools/build_publisher_synopsis_release.py
            test ! -L tools/build_publisher_synopsis_release.py
            python3 tools/build_publisher_synopsis_release.py --check
          fi

      - name: Verify optional read-only metadata recheck projection
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          if git cat-file -e HEAD:explorer/metadata-rechecks.json 2>/dev/null || \
             test -e explorer/metadata-rechecks.json || test -L explorer/metadata-rechecks.json; then
            test -f explorer/metadata-rechecks.json
            test ! -L explorer/metadata-rechecks.json
            test -f tools/build_metadata_recheck_projection.py
            test ! -L tools/build_metadata_recheck_projection.py
            python3 tools/build_metadata_recheck_projection.py --check
          fi

      - name: Verify accepted first-party source-card recheck sidecar
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          # Additive, source-local publisher cards only: keep prior 56 checks intact.
          if git cat-file -e HEAD:explorer/accepted-source-card-rechecks.json 2>/dev/null || \
             test -e explorer/accepted-source-card-rechecks.json || \
             test -L explorer/accepted-source-card-rechecks.json; then
            test -f explorer/accepted-source-card-rechecks.json
            test ! -L explorer/accepted-source-card-rechecks.json
            test -f tools/build_accepted_source_card_rechecks.py
            test ! -L tools/build_accepted_source_card_rechecks.py
            python3 tools/build_accepted_source_card_rechecks.py --check
            python3 tools/query_accepted_source_card_rechecks.py --limit 1 > /dev/null
          fi

      - name: Verify optional original short-form synopsis appendix
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          if git cat-file -e HEAD:explorer/short-synopsis-catalog.json 2>/dev/null || \
             test -e explorer/short-synopsis-catalog.json || test -L explorer/short-synopsis-catalog.json; then
            test -f explorer/short-synopsis-catalog.json
            test ! -L explorer/short-synopsis-catalog.json
            test -f tools/build_short_publisher_overview_request.py
            test ! -L tools/build_short_publisher_overview_request.py
            test -f tools/build_short_publisher_overview_release.py
            test ! -L tools/build_short_publisher_overview_release.py
            python3 tools/build_short_publisher_overview_request.py --check
            python3 tools/build_short_publisher_overview_release.py --check
          fi

      - name: Verify final public artifact boundary
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          # Run this AFTER all repository-controlled tests and generators.
          # Publish five committed core files, plus separately verified optional discovery indexes.
          test -d explorer
          test -f explorer/index.html
          test -f explorer/index.json
          test -f explorer/app.js
          test -f explorer/app.css
          test -f explorer/trek-data-core-hero.jpg
          test -f docs/assets/trek-data-core-hero.jpg
          test ! -L docs
          test ! -L docs/assets
          test ! -L docs/assets/trek-data-core-hero.jpg
          cmp docs/assets/trek-data-core-hero.jpg explorer/trek-data-core-hero.jpg
          test ! -L explorer
          if find explorer -type l -print -quit | grep -q .; then
            echo "Refusing to deploy a site containing symlinks" >&2
            exit 1
          fi
          # Include directories and special entries, not just regular files:
          # no surprise files, FIFOs, nested folders or hidden content.
          if find explorer -mindepth 1 \
            ! -path explorer/index.html \
            ! -path explorer/index.json \
            ! -path explorer/app.js \
            ! -path explorer/app.css \
            ! -path explorer/trek-data-core-hero.jpg \
            ! -path explorer/research-leads.json \
            ! -path explorer/discovery-catalog.json \
            ! -path explorer/search-catalog.json \
            ! -path explorer/lit-publisher-edition-leads.json \
            ! -path explorer/publisher-isbn-crosschecks.json \
            ! -path explorer/paramount-film-rechecks.json \
            ! -path explorer/episode-source-cards.json \
            ! -path explorer/film-catalog.json \
            ! -path explorer/metadata-rechecks.json \
            ! -path explorer/accepted-source-card-rechecks.json \
            ! -path explorer/short-synopsis-catalog.json \
            ! -path explorer/synopsis-catalog.json \
            ! -path explorer/art-original-episode.svg \
            ! -path explorer/art-original-film.svg \
            ! -path explorer/art-original-literature.svg \
            ! -path explorer/art-original-short-form.svg \
            ! -path explorer/art-original-audio.svg -print -quit | grep -q .; then
            echo "Refusing to publish an unexpected Explorer entry" >&2
            exit 1
          fi
          for path in explorer/index.html explorer/index.json explorer/app.js explorer/app.css explorer/trek-data-core-hero.jpg; do
            expected="$(git rev-parse "HEAD:$path")"
            actual="$(git hash-object "$path")"
            if test "$actual" != "$expected"; then
              echo "Refusing to deploy modified Explorer content: $path" >&2
              exit 1
            fi
          done
          if git cat-file -e HEAD:explorer/research-leads.json 2>/dev/null; then
            test -f explorer/research-leads.json
            test ! -L explorer/research-leads.json
            expected="$(git rev-parse HEAD:explorer/research-leads.json)"
            actual="$(git hash-object explorer/research-leads.json)"
            if test "$actual" != "$expected"; then
              echo "Refusing to deploy modified Research Leads content" >&2
              exit 1
            fi
          elif test -e explorer/research-leads.json || test -L explorer/research-leads.json; then
            echo "Refusing to deploy an uncommitted Research Leads index" >&2
            exit 1
          fi
          if git cat-file -e HEAD:explorer/film-catalog.json 2>/dev/null; then
            test -f explorer/film-catalog.json
            test ! -L explorer/film-catalog.json
            expected="$(git rev-parse HEAD:explorer/film-catalog.json)"
            actual="$(git hash-object explorer/film-catalog.json)"
            if test "$actual" != "$expected"; then
              echo "Refusing to deploy modified Film discovery content" >&2
              exit 1
            fi
          elif test -e explorer/film-catalog.json || test -L explorer/film-catalog.json; then
            echo "Refusing to deploy an uncommitted Film discovery index" >&2
            exit 1
          fi
          if git cat-file -e HEAD:explorer/discovery-catalog.json 2>/dev/null; then
            test -f explorer/discovery-catalog.json
            test ! -L explorer/discovery-catalog.json
            expected="$(git rev-parse HEAD:explorer/discovery-catalog.json)"
            actual="$(git hash-object explorer/discovery-catalog.json)"
            if test "$actual" != "$expected"; then
              echo "Refusing to deploy modified Multimedia directory" >&2
              exit 1
            fi
          elif test -e explorer/discovery-catalog.json || test -L explorer/discovery-catalog.json; then
            echo "Refusing to deploy uncommitted Multimedia directory" >&2
            exit 1
          fi
          if git cat-file -e HEAD:explorer/search-catalog.json 2>/dev/null; then
            test -f explorer/search-catalog.json
            test ! -L explorer/search-catalog.json
            expected="$(git rev-parse HEAD:explorer/search-catalog.json)"
            actual="$(git hash-object explorer/search-catalog.json)"
            if test "$actual" != "$expected"; then
              echo "Refusing to deploy modified source-local search projection" >&2
              exit 1
            fi
          elif test -e explorer/search-catalog.json || test -L explorer/search-catalog.json; then
            echo "Refusing to deploy an uncommitted source-local search projection" >&2
            exit 1
          fi
          if git cat-file -e HEAD:explorer/lit-publisher-edition-leads.json 2>/dev/null; then
            test -f explorer/lit-publisher-edition-leads.json
            test ! -L explorer/lit-publisher-edition-leads.json
            expected="$(git rev-parse HEAD:explorer/lit-publisher-edition-leads.json)"
            actual="$(git hash-object explorer/lit-publisher-edition-leads.json)"
            if test "$actual" != "$expected"; then
              echo "Refusing to deploy modified publisher edition lead overlay" >&2
              exit 1
            fi
          elif test -e explorer/lit-publisher-edition-leads.json || test -L explorer/lit-publisher-edition-leads.json; then
            echo "Refusing to deploy an uncommitted publisher edition lead overlay" >&2
            exit 1
          fi
          if git cat-file -e HEAD:explorer/publisher-isbn-crosschecks.json 2>/dev/null; then
            test -f explorer/publisher-isbn-crosschecks.json
            test ! -L explorer/publisher-isbn-crosschecks.json
            expected="$(git rev-parse HEAD:explorer/publisher-isbn-crosschecks.json)"
            actual="$(git hash-object explorer/publisher-isbn-crosschecks.json)"
            if test "$actual" != "$expected"; then
              echo "Refusing to deploy modified public publisher ISBN crosscheck overlay" >&2
              exit 1
            fi
          elif test -e explorer/publisher-isbn-crosschecks.json || test -L explorer/publisher-isbn-crosschecks.json; then
            echo "Refusing to deploy an uncommitted publisher ISBN crosscheck overlay" >&2
            exit 1
          fi
          if git cat-file -e HEAD:explorer/paramount-film-rechecks.json 2>/dev/null; then
            test -f explorer/paramount-film-rechecks.json
            test ! -L explorer/paramount-film-rechecks.json
            expected="$(git rev-parse HEAD:explorer/paramount-film-rechecks.json)"
            actual="$(git hash-object explorer/paramount-film-rechecks.json)"
            if test "$actual" != "$expected"; then
              echo "Refusing to deploy modified Paramount source-local metadata shelf" >&2
              exit 1
            fi
          elif test -e explorer/paramount-film-rechecks.json || test -L explorer/paramount-film-rechecks.json; then
            echo "Refusing to deploy uncommitted Paramount metadata shelf" >&2
            exit 1
          fi
          if git cat-file -e HEAD:explorer/episode-source-cards.json 2>/dev/null; then
            test -f explorer/episode-source-cards.json
            test ! -L explorer/episode-source-cards.json
            expected="$(git rev-parse HEAD:explorer/episode-source-cards.json)"
            actual="$(git hash-object explorer/episode-source-cards.json)"
            if test "$actual" != "$expected"; then
              echo "Refusing to deploy modified source-local episode guide shelf" >&2
              exit 1
            fi
          elif test -e explorer/episode-source-cards.json || test -L explorer/episode-source-cards.json; then
            echo "Refusing to deploy uncommitted episode guide shelf" >&2
            exit 1
          fi
          if git cat-file -e HEAD:explorer/synopsis-catalog.json 2>/dev/null; then
            test -f explorer/synopsis-catalog.json
            test ! -L explorer/synopsis-catalog.json
            expected="$(git rev-parse HEAD:explorer/synopsis-catalog.json)"
            actual="$(git hash-object explorer/synopsis-catalog.json)"
            if test "$actual" != "$expected"; then
              echo "Refusing to deploy modified publisher synopsis release" >&2
              exit 1
            fi
          elif test -e explorer/synopsis-catalog.json || test -L explorer/synopsis-catalog.json; then
            echo "Refusing to deploy an uncommitted publisher synopsis release" >&2
            exit 1
          fi
          if git cat-file -e HEAD:explorer/metadata-rechecks.json 2>/dev/null; then
            test -f explorer/metadata-rechecks.json
            test ! -L explorer/metadata-rechecks.json
            expected="$(git rev-parse HEAD:explorer/metadata-rechecks.json)"
            actual="$(git hash-object explorer/metadata-rechecks.json)"
            if test "$actual" != "$expected"; then
              echo "Refusing to deploy modified metadata recheck projection" >&2
              exit 1
            fi
          elif test -e explorer/metadata-rechecks.json || test -L explorer/metadata-rechecks.json; then
            echo "Refusing to deploy uncommitted metadata recheck projection" >&2
            exit 1
          fi
          if git cat-file -e HEAD:explorer/accepted-source-card-rechecks.json 2>/dev/null; then
            test -f explorer/accepted-source-card-rechecks.json
            test ! -L explorer/accepted-source-card-rechecks.json
            expected="$(git rev-parse HEAD:explorer/accepted-source-card-rechecks.json)"
            actual="$(git hash-object explorer/accepted-source-card-rechecks.json)"
            if test "$actual" != "$expected"; then
              echo "Refusing to deploy modified accepted publisher-card sidecar" >&2
              exit 1
            fi
          elif test -e explorer/accepted-source-card-rechecks.json || test -L explorer/accepted-source-card-rechecks.json; then
            echo "Refusing to deploy uncommitted accepted publisher-card sidecar" >&2
            exit 1
          fi
          if git cat-file -e HEAD:explorer/short-synopsis-catalog.json 2>/dev/null; then
            test -f explorer/short-synopsis-catalog.json
            test ! -L explorer/short-synopsis-catalog.json
            expected="$(git rev-parse HEAD:explorer/short-synopsis-catalog.json)"
            actual="$(git hash-object explorer/short-synopsis-catalog.json)"
            if test "$actual" != "$expected"; then
              echo "Refusing to deploy modified short-form publisher synopsis release" >&2
              exit 1
            fi
          elif test -e explorer/short-synopsis-catalog.json || test -L explorer/short-synopsis-catalog.json; then
            echo "Refusing to deploy uncommitted short-form synopsis release" >&2
            exit 1
          fi
          for medium in episode film literature short-form audio; do
            path="explorer/art-original-${medium}.svg"
            if git cat-file -e "HEAD:$path" 2>/dev/null; then
              test -f "$path"
              test ! -L "$path"
              expected="$(git rev-parse "HEAD:$path")"
              actual="$(git hash-object "$path")"
              if test "$actual" != "$expected"; then
                echo "Refusing to deploy modified original abstract artwork: $path" >&2
                exit 1
              fi
            elif test -e "$path" || test -L "$path"; then
              echo "Refusing to deploy uncommitted abstract artwork: $path" >&2
              exit 1
            fi
          done

      - name: Upload Explorer only
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: explorer


  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified Explorer artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
