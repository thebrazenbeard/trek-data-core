name: Deploy Trek Explorer to Pages

on:
  push:
    branches: [main]
    paths:
      - "explorer/**"
      - "registry/mission_catalog.json"
      - "registry/approved_projection_hashes.json"
      - "tools/build_explorer_index.py"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: trek-explorer-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out accepted source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check whether the Explorer has landed on main
        id: readiness
        shell: bash
        run: |
          if test -f explorer/index.html && test -f explorer/index.json && \
             test -f explorer/app.js && test -f explorer/app.css; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Explorer assets not yet on main; skipping Pages publication.'
          fi

      - name: Verify public artifact boundary
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          test -f explorer/index.html
          test -f explorer/index.json
          test ! -L explorer
          if find explorer -type l -print -quit | grep -q .; then
            echo "Refusing to deploy a site containing symlinks" >&2
            exit 1
          fi
          if find explorer -type f \
            ! -path explorer/index.html \
            ! -path explorer/index.json \
            ! -path explorer/app.js \
            ! -path explorer/app.css -print -quit | grep -q .; then
            echo "Refusing to publish an unexpected Explorer file" >&2
            exit 1
          fi

      - name: Verify Explorer behavior before deployment
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          node tests/test_explorer.mjs

      - name: Verify deterministic catalog index
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          python3 tools/build_explorer_index.py --out "${RUNNER_TEMP}/trek-index-expected.json"
          cmp "${RUNNER_TEMP}/trek-index-expected.json" explorer/index.json

      - name: Configure GitHub Pages
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Explorer only
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: explorer

      - name: Deploy Explorer
        if: steps.readiness.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
