name: Deploy Trek Explorer to Pages

on:
  push:
    branches: [main]
    paths:
      - "explorer/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: trek-explorer-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out accepted source
        uses: actions/checkout@v6

      - name: Verify public artifact boundary
        shell: bash
        run: |
          test -f explorer/index.html
          test -f explorer/index.json
          test ! -L explorer
          if find explorer -type l -print -quit | grep -q .; then
            echo "Refusing to deploy a site containing symlinks" >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Explorer only
        uses: actions/upload-pages-artifact@v4
        with:
          path: explorer

      - name: Deploy Explorer
        id: deployment
        uses: actions/deploy-pages@v4
