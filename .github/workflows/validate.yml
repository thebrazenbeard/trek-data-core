name: validate-core

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run validation regression tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Validate repository records
        run: python tools/validate.py
      - name: Build projection twice
        run: |
          python tools/build_projection.py --out /tmp/projection-a --compiler-commit "$GITHUB_SHA"
          python tools/build_projection.py --out /tmp/projection-b --compiler-commit "$GITHUB_SHA"
      - name: Assert deterministic output
        run: diff -ru /tmp/projection-a /tmp/projection-b
