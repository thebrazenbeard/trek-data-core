name: Workspace Startup Safety
on: [push, pull_request]
permissions:
  contents: read
jobs:
  editor-autostart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reject hidden workspace startup execution
        run: python3 -m unittest discover -s tests -p test_workspace_startup_safety.py -v
